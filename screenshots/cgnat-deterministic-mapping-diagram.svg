<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#070e24" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#070e24" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f9fafb" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Carrier-Grade NAT &amp; RFC 7422 Deterministic Port Batching Architecture</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">How Deterministic Mapping Eliminates Terabytes of Lawful Intercept Logging &amp; Enables Stateful NAT64</text>

  <!-- Subscribers Domain (Left) -->
  <rect x="50" y="110" width="240" height="165" rx="8" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="2" />
  <rect x="65" y="125" width="210" height="24" rx="4" fill="rgba(6, 182, 212, 0.2)" />
  <text x="170" y="141" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">RFC 6598 Subscribers</text>
  <text x="65" y="170" fill="#cbd5e1" font-family="monospace" font-size="11">• Subnet: 100.64.0.0/10</text>
  <text x="65" y="190" fill="#fbbf24" font-family="monospace" font-size="11">• Sub 1: 100.64.1.50</text>
  <text x="65" y="210" fill="#38bdf8" font-family="monospace" font-size="11">• Sub 2: 100.64.1.51</text>
  <text x="65" y="235" fill="#c4b5fd" font-family="monospace" font-size="11">• IPv6 5G: 2001:db8:1::10</text>
  <text x="65" y="258" fill="#94a3b8" font-family="sans-serif" font-size="9">Shared Carrier Non-Routable Space</text>

  <!-- CGNAT Core Router (Center) -->
  <rect x="360" y="110" width="280" height="165" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="375" y="125" width="250" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)" />
  <text x="500" y="141" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Carrier CGNAT / NAT64 Gateway</text>
  <text x="375" y="170" fill="#cbd5e1" font-family="monospace" font-size="11">• RFC 7422 Deterministic Engine</text>
  <text x="375" y="190" fill="#34d399" font-family="monospace" font-size="11">• Block Size: 1024 Ports / Sub</text>
  <text x="375" y="210" fill="#fbbf24" font-family="monospace" font-size="11">• 63 Subscribers per Public IP</text>
  <text x="375" y="230" fill="#22d3ee" font-family="monospace" font-size="11">• Stateful NAT64: 64:ff9b::/96</text>
  <text x="375" y="255" fill="#a7f3d0" font-family="sans-serif" font-size="10">EIM &amp; Hairpinning Active</text>

  <!-- Public Internet / Public Pool (Right) -->
  <rect x="710" y="110" width="240" height="165" rx="8" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="2" />
  <rect x="725" y="125" width="210" height="24" rx="4" fill="rgba(56, 189, 248, 0.2)" />
  <text x="830" y="141" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Public IPv4 Pool &amp; Transit</text>
  <text x="725" y="170" fill="#cbd5e1" font-family="monospace" font-size="11">• Pool: 198.51.100.1 - .64</text>
  <text x="725" y="190" fill="#fbbf24" font-family="monospace" font-size="11">• IP .5: Ports 56320 - 57343</text>
  <text x="725" y="210" fill="#38bdf8" font-family="monospace" font-size="11">• IP .5: Ports 57344 - 58367</text>
  <text x="725" y="235" fill="#34d399" font-family="sans-serif" font-size="10">Consolidated Public Transit</text>
  <text x="725" y="255" fill="#cbd5e1" font-family="sans-serif" font-size="10">Global Internet (8.8.8.8, Cloud)</text>

  <!-- Connectors -->
  <line x1="290" y1="185" x2="360" y2="185" stroke="#06b6d4" stroke-width="3" />
  <text x="325" y="175" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="middle">100.64/10</text>

  <line x1="640" y1="185" x2="710" y2="185" stroke="#38bdf8" stroke-width="3" />
  <text x="675" y="175" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Public SNAT</text>

  <!-- Lawful Intercept Box (Bottom Center) -->
  <rect x="360" y="310" width="280" height="120" rx="8" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="2" />
  <rect x="375" y="325" width="250" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)" />
  <text x="500" y="341" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Lawful Intercept / Subpoena Query</text>
  <text x="375" y="370" fill="#cbd5e1" font-family="monospace" font-size="11">Input: 198.51.100.5 : Port 11500</text>
  <text x="375" y="390" fill="#34d399" font-family="monospace" font-size="11">Output: 100.64.1.6 (Resolved in O(1))</text>
  <text x="375" y="415" fill="#a7f3d0" font-family="sans-serif" font-size="10">Zero Syslog Storage Required!</text>

  <line x1="500" y1="275" x2="500" y2="310" stroke="#fbbf24" stroke-width="3" />

  <!-- Hardened Defense Box (Bottom Left) -->
  <rect x="50" y="470" width="900" height="175" rx="8" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="65" y="485" width="870" height="26" rx="4" fill="rgba(16, 185, 129, 0.2)" />
  <text x="500" y="502" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Carrier-Grade NAT &amp; NAT64 Defense Principles (Synthesized by CGNATForge Pro)</text>
  <text x="80" y="535" fill="#34d399" font-family="monospace" font-size="11">1. RFC 7422 Deterministic Port Allocation:</text>
  <text x="400" y="535" fill="#cbd5e1" font-family="sans-serif" font-size="11">Eliminates 1.2+ TB daily syslog overhead by algorithmically binding subscriber to port block.</text>

  <text x="80" y="565" fill="#34d399" font-family="monospace" font-size="11">2. Subscriber Port Quota Limiting:</text>
  <text x="400" y="565" fill="#cbd5e1" font-family="sans-serif" font-size="11">Enforce 1024–2048 ports per subscriber to prevent P2P torrent or botnet pool starvation.</text>

  <text x="80" y="595" fill="#34d399" font-family="monospace" font-size="11">3. Endpoint-Independent Mapping (EIM):</text>
  <text x="400" y="595" fill="#cbd5e1" font-family="sans-serif" font-size="11">Hairpinning allows internal subscribers to connect directly for gaming, VoIP, and WebRTC.</text>

  <text x="80" y="625" fill="#34d399" font-family="monospace" font-size="11">4. Virtual Packet Reassembly &amp; MSS Clamping:</text>
  <text x="400" y="625" fill="#cbd5e1" font-family="sans-serif" font-size="11">Prevents fragment evasion attacks and eliminates PMTU discovery tunnel blackholes.</text>
</svg>
